<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>局域网投屏 - 安卓客户端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 100%;
            padding: 20px;
        }
        
        /* 连接界面 */
        .connect-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #333;
            border-radius: 10px;
            background: #0f0f1a;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #2196F3;
        }
        
        .btn {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(33, 150, 243, 0.4);
        }
        
        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* 主界面 */
        .main-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f44336;
        }
        
        .status-dot.connected {
            background: #4CAF50;
        }
        
        .screen-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }
        
        .screen-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .waiting-text {
            color: #666;
            font-size: 16px;
            text-align: center;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .btn-control {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-audio {
            background: #4CAF50;
            color: #fff;
        }
        
        .btn-audio.muted {
            background: #555;
        }
        
        .btn-disconnect {
            background: #f44336;
            color: #fff;
        }
        
        /* 消息栏 */
        .message-bar {
            display: none;
            padding: 15px 20px;
            background: #2196F3;
            animation: slideUp 0.3s;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        /* 锁定遮罩 */
        .lock-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .lock-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        .lock-text {
            font-size: 20px;
            text-align: center;
            color: #fff;
        }
        
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 连接界面 -->
    <div class="connect-screen" id="connectScreen">
        <div class="logo">📺</div>
        <div class="title">局域网投屏系统<br><small style="color:#888">安卓客户端</small></div>
        
        <div class="form-group">
            <label>🖥 教师IP地址</label>
            <input type="text" id="serverIp" placeholder="例如: 192.168.1.100">
        </div>
        
        <div class="form-group">
            <label>👤 学生姓名</label>
            <input type="text" id="studentName" placeholder="请输入您的姓名">
        </div>
        
        <button class="btn btn-primary" id="connectBtn" onclick="connect()">
            🔗 连接
        </button>
        
        <p style="margin-top: 20px; color: #666; font-size: 12px;">
            请确保与教师在同一局域网内
        </p>
    </div>
    
    <!-- 主界面 -->
    <div class="main-screen" id="mainScreen">
        <div class="header">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">未连接</span>
            </div>
            <span id="infoText" style="color: #888; font-size: 12px;"></span>
        </div>
        
        <div class="screen-container" id="screenContainer">
            <p class="waiting-text" id="waitingText">等待教师广播...</p>
            <img class="screen-image" id="screenImage" style="display: none;">
        </div>
        
        <div class="message-bar" id="messageBar">
            <span id="messageText"></span>
        </div>
        
        <div class="controls">
            <button class="btn-control btn-audio" id="audioBtn" onclick="toggleAudio()">
                🔊 音频
            </button>
            <button class="btn-control btn-disconnect" onclick="disconnect()">
                断开连接
            </button>
        </div>
    </div>
    
    <!-- 锁定遮罩 -->
    <div class="lock-overlay" id="lockOverlay">
        <div class="lock-icon">🔒</div>
        <div class="lock-text">
            屏幕已被教师锁定<br>
            请等待教师解锁...
        </div>
    </div>

    <script>
        let ws = null;
        let audioEnabled = true;
        
        function connect() {
            const serverIp = document.getElementById('serverIp').value.trim();
            const studentName = document.getElementById('studentName').value.trim();
            
            if (!serverIp) {
                alert('请输入教师IP地址');
                return;
            }
            if (!studentName) {
                alert('请输入学生姓名');
                return;
            }
            
            const btn = document.getElementById('connectBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>连接中...';
            
            // 连接 WebSocket
            const wsPort = 8765;
            ws = new WebSocket(`ws://localhost:${wsPort}`);
            
            ws.onopen = function() {
                ws.send(JSON.stringify({
                    type: 'connect',
                    serverIp: serverIp,
                    studentName: studentName
                }));
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            
            ws.onerror = function(error) {
                alert('连接失败，请确保后端服务已启动');
                btn.disabled = false;
                btn.innerHTML = '🔗 连接';
            };
            
            ws.onclose = function() {
                updateStatus(false);
            };
        }
        
        function handleMessage(data) {
            switch(data.type) {
                case 'connected':
                    showMainScreen();
                    updateStatus(true, data.serverIp, data.studentId);
                    break;
                    
                case 'disconnected':
                    updateStatus(false);
                    alert('连接断开: ' + data.reason);
                    showConnectScreen();
                    break;
                    
                case 'screen_frame':
                    showScreenFrame(data.image);
                    break;
                    
                case 'message':
                    showMessage(data.text);
                    break;
                    
                case 'screen_locked':
                    document.getElementById('lockOverlay').style.display = 'flex';
                    break;
                    
                case 'screen_unlocked':
                    document.getElementById('lockOverlay').style.display = 'none';
                    break;
            }
        }
        
        function showMainScreen() {
            document.getElementById('connectScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'flex';
        }
        
        function showConnectScreen() {
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('connectScreen').style.display = 'flex';
            const btn = document.getElementById('connectBtn');
            btn.disabled = false;
            btn.innerHTML = '🔗 连接';
        }
        
        function updateStatus(connected, serverIp, studentId) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const info = document.getElementById('infoText');
            
            if (connected) {
                dot.classList.add('connected');
                text.textContent = '已连接';
                info.textContent = `服务器: ${serverIp} | ID: ${studentId}`;
            } else {
                dot.classList.remove('connected');
                text.textContent = '未连接';
                info.textContent = '';
            }
        }
        
        function showScreenFrame(imageData) {
            const img = document.getElementById('screenImage');
            const waiting = document.getElementById('waitingText');
            
            img.src = 'data:image/jpeg;base64,' + imageData;
            img.style.display = 'block';
            waiting.style.display = 'none';
        }
        
        function showMessage(text) {
            const bar = document.getElementById('messageBar');
            const msgText = document.getElementById('messageText');
            
            msgText.textContent = '💬 教师消息: ' + text;
            bar.style.display = 'block';
            
            setTimeout(() => {
                bar.style.display = 'none';
            }, 8000);
        }
        
        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audioBtn');
            
            if (audioEnabled) {
                btn.textContent = '🔊 音频';
                btn.classList.remove('muted');
            } else {
                btn.textContent = '🔇 静音';
                btn.classList.add('muted');
            }
            
            if (ws) {
                ws.send(JSON.stringify({
                    type: 'toggle_audio',
                    enabled: audioEnabled
                }));
            }
        }
        
        function disconnect() {
            if (ws) {
                ws.send(JSON.stringify({ type: 'disconnect' }));
                ws.close();
            }
            showConnectScreen();
            document.getElementById('lockOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
